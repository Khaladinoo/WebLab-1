<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
</head>
<body>
    <header>
        <h1>Personal Portfolio</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="services.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Connect With Me</h2>

        <form action="#" method="post">
            <fieldset>
                <legend>Professional Inquiry Form</legend>

                <p>
                    <label for="fullName">Your Name:</label><br>
                    <input type="text" id="fullName" name="fullName" required>
                </p>

                <p>
                    <label for="emailAddress">Your Email:</label><br>
                    <input type="email" id="emailAddress" name="emailAddress" required>
                </p>

                <p>
                    <label for="contactDate">Preferred Meeting Date:</label><br>
                    <input type="date" id="contactDate" name="contactDate" required>
                </p>

                <p>
                    <label for="topic">Collaboration Area:</label><br>
                    <select id="topic" name="topic">
                        <option value="software">Software Development &amp; Architecture</option>
                        <option value="networking">Network Configuration &amp; Design</option>
                        <option value="academic">Academic Research &amp; Projects</option>
                    </select>
                </p>

                <p>
                    <label for="message">Message Details:</label><br>
                    <textarea id="message" name="message" rows="5" cols="40" placeholder="Write your inquiry or proposal here..."></textarea>
                </p>

                <p>
                    <button type="submit">Send Inquiry</button>
                </p>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Portfolio. All rights reserved. Built by KHALDOUN DAYEH.</p>
    </footer>
</body>
</html>
